* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); }

.timeline-header { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.phase-pill {
  padding: 10px 12px; border-radius: var(--border-radius-lg, 12px);
  cursor: pointer; border: 1.5px solid transparent;
  transition: all .2s; text-align: center;
}
.phase-pill h3 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.phase-pill p { font-size: 11px; opacity: .75; }
.phase-pill.p0 { background: var(--phase-0); color: var(--phase-0t); }
.phase-pill.p1 { background: var(--phase-1); color: var(--phase-1t); }
.phase-pill.p2 { background: var(--phase-2); color: var(--phase-2t); }
.phase-pill.p3 { background: var(--phase-3); color: var(--phase-3t); }
.phase-pill.active { border-color: currentColor; transform: translateY(-2px); }

.domain-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.dtab {

.dtab.active, .dtab:hover {
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
}
.dtab.active { border-color: var(--color-border-primary, rgba(0,0,0,0.4)); font-weight: 500; }

.content-area { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .content-area { grid-template-columns: 1fr; } .timeline-header { grid-template-columns: repeat(2,1fr); } }

.card {
  background: var(--color-background-primary);

  padding: 14px 16px;
}
.card-full { grid-column: 1 / -1; }
.card h4 { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.card h4 i { font-size: 16px; }

.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 12px;
  border: 0.5px solid var(--color-border-tertiary);
  color: var(--color-text-secondary); background: var(--color-background-secondary);
}
.tag.danger { background: #FCEBEB; color: #791F1F; border-color: #F7C1C1; }
.tag.safe  { background: #EAF3DE; color: #27500A; border-color: #C0DD97; }
.tag.info  { background: #E6F1FB; color: #0C447C; border-color: #B5D4F4; }
.tag.amber { background: #FAEEDA; color: #633806; border-color: #FAC775; }
@media (prefers-color-scheme: dark) {
  .tag.danger { background: #501313; color: #F7C1C1; border-color: #791F1F; }

  .tag.amber  { background: #412402; color: #FAC775; border-color: #854F0B; }
}

.item-list { list-style: none; }
.item-list li {
  font-size: 13px; color: var(--color-text-primary);

.cert-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }

let currentPhase = 0;
let currentDomain = 0;

function setPhase(p) {
  currentPhase = p;
  currentDomain = 0;
  document.querySelectorAll('.phase-pill').forEach((el,i) => el.classList.toggle('active', i===p));
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabs = document.getElementById('domainTabs');
  const doms = phases[currentPhase].domains;
  tabs.innerHTML = doms.map((d, i) =>
    `<button class="dtab${i===currentDomain?' active':''}" onclick="setDomain(${i})"><i class="ti ${d.icon}" aria-hidden="true" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>${d.name}</button>`
  ).join('');
}

function setDomain(i) {
  currentDomain = i;
  renderTabs();
  renderContent();
}

function nextDomain() {
  const doms = phases[currentPhase].domains;
  if (currentDomain < doms.length - 1) { setDomain(currentDomain + 1); }
  else if (currentPhase < phases.length - 1) { setPhase(currentPhase + 1); }
}
function prevDomain() {
  if (currentDomain > 0) { setDomain(currentDomain - 1); }
  else if (currentPhase > 0) {
    currentPhase--;
    currentDomain = phases[currentPhase].domains.length - 1;
    document.querySelectorAll('.phase-pill').forEach((el,i) => el.classList.toggle('active', i===currentPhase));
    renderTabs(); renderContent();
  }
}

function tags(arr, cls) {
  return arr.map(t => `<span class="tag ${cls||''}">${t}</span>`).join('');
}

function renderContent() {
  const phase = phases[currentPhase];
  const dom = phase.domains[currentDomain];
  document.getElementById('phaseNote').textContent = phase.note;

  if (dom.isCerts) {
    const entryC = dom.certs.filter(c=>c.level==='entry');
    const midC = dom.certs.filter(c=>c.level==='mid');
    const advC = dom.certs.filter(c=>c.level==='adv');
    const certRow = (c) => `<div class="cert-card ${c.level}">
      <div class="level ${c.level}">${c.level==='entry'?'Entry':''}${c.level==='mid'?'Intermediate':''}${c.level==='adv'?'Advanced':''}</div>
      <div class="name">${c.name}</div>
      <div class="body">${c.body}</div>
    </div>`;
    document.getElementById('contentArea').innerHTML = `
      <div class="card card-full">
        <h4><i class="ti ti-certificate" aria-hidden="true"></i> Certification roadmap</h4>
        <div class="cert-grid">
          ${dom.certs.map(certRow).join('')}
        </div>
      </div>`;
    return;
  }

  let html = '';

  if (dom.concepts && dom.concepts.length) {
    html += `<div class="card"><h4><i class="ti ti-bulb" aria-hidden="true"></i> Core concepts</h4>
      <ul class="item-list">${dom.concepts.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  }

  if (dom.attacks && dom.attacks.length) {
    html += `<div class="card"><h4><i class="ti ti-bug" aria-hidden="true"></i> Attacks to know</h4>
      <div class="tag-list">${tags(dom.attacks,'danger')}</div></div>`;
  }

  if (dom.defenses && dom.defenses.length) {
    html += `<div class="card"><h4><i class="ti ti-shield-check" aria-hidden="true"></i> Defensive techniques</h4>
      <div class="tag-list">${tags(dom.defenses,'safe')}</div></div>`;
  }

  if (dom.labs && dom.labs.length) {
    html += `<div class="card"><h4><i class="ti ti-flask" aria-hidden="true"></i> Hands-on labs</h4>
      <ul class="item-list">${dom.labs.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;
  }

  if (dom.courses && dom.courses.length) {
    html += `<div class="card"><h4><i class="ti ti-book" aria-hidden="true"></i> Courses</h4>
      ${dom.courses.map(c=>`<div class="resource-row">
        <span class="resource-item">
          <i class="ti ${c.type==='free'?'ti-gift':'ti-credit-card'}" aria-hidden="true"></i>
          <span class="tag ${c.type==='free'?'safe':'info'}" style="margin-right:4px">${c.type}</span>
          <span style="font-size:12px;color:var(--color-text-primary)">${c.name}</span>
        </span>
      </div>`).join('')}
    </div>`;
  }

  if (dom.tools && dom.tools.length) {
    html += `<div class="card"><h4><i class="ti ti-tools" aria-hidden="true"></i> Tools & platforms</h4>
      <div class="tag-list">${tags(dom.tools,'amber')}</div></div>`;
  }

  document.getElementById('contentArea').innerHTML = html;
}

renderTabs();
renderContent();
</script>
