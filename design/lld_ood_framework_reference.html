// Strategy pattern for pricing
interface PricingStrategy {
  double calculate(Ticket ticket);
}
class HourlyPricing implements PricingStrategy {
  public double calculate(Ticket t) {
    long hours = ChronoUnit.HOURS.between(
      t.getEntryTime(), LocalDateTime.now());

  }

      num:"04",label:"Architecture",title:"Establish relationships",cls:"s4",
      relations:[

        "LRUCache HAS-A DoublyLinkedList (via head/tail) → Composition",
        "Node HAS-A key + value + prev + next → Composition",
        "head ↔ most-recent, tail ↔ least-recent (evict from tail)"
      ],
      cardinality:"Cache 1→N Nodes (bounded by capacity)",
      tip:"Sentinel head/tail nodes eliminate null checks on edge cases (empty list, single element)."
    },
    {
      num:"05",label:"Patterns",title:"Apply design patterns",cls:"s5",
      patterns:[
        {name:"None forced",use:"Pure data structure design — resist over-engineering"},
        {name:"Template Method",use:"BaseCache with abstract evict() → LRUCache, LFUCache"},
        {name:"Decorator",use:"LoggingCache wraps LRUCache for observability"},
        {name:"Strategy (advanced)",use:"EvictionStrategy — swap LRU ↔ LFU ↔ MRU"}
      ],
      tip:"If asked to extend to LFU later, the Strategy pattern on eviction makes it clean."
    },
    {
      num:"06",label:"Code",title:"Code & concurrency",cls:"s6",
      concurrency:["ReadWriteLock: multiple readers, exclusive writer","Or use ConcurrentHashMap + synchronized linked list ops","Java: LinkedHashMap(cap, 0.75f, true) as shortcut"],
      code:`class LRUCache {
  private final int capacity;
  private final Map<Integer, Node> map;
  private final Node head, tail; // sentinels
  private final ReadWriteLock lock = new ReentrantReadWriteLock();

  public int get(int key) {
    lock.readLock().lock();
    try {
      if (!map.containsKey(key)) return -1;
      Node n = map.get(key);
      moveToFront(n);   // upgrade to write lock in real impl
      return n.val;
    } finally { lock.readLock().unlock(); }
  }

  public void put(int key, int value) {
    lock.writeLock().lock();
    try {
      if (map.containsKey(key)) {
        map.get(key).val = value;
        moveToFront(map.get(key));
      } else {
        if (map.size() == capacity) evictLRU();
        Node n = new Node(key, value);
        addToFront(n);
        map.put(key, n);
      }
    } finally { lock.writeLock().unlock(); }
  }
}`,
      tip:"Mention ReadWriteLock — reads don't block each other, only writes are exclusive."
    }
  ]

      concurrency:["synchronized on per-user bucket (fine-grained locks)","AtomicReference for lock-free token updates","Distributed: Redis EVAL (Lua script) for atomic check-and-decrement"],
      code:`interface RateLimiter {
  RateLimitResult tryAcquire(String userId);
}

class TokenBucketLimiter implements RateLimiter {
  private final double refillRate;    // tokens/sec
  private final double capacity;
  private final Map<String, TokenBucket> buckets
    = new ConcurrentHashMap<>();

  public RateLimitResult tryAcquire(String userId) {
    TokenBucket bucket = buckets.computeIfAbsent(
      userId, k -> new TokenBucket(capacity));
    synchronized (bucket) {
      bucket.refill(refillRate);
      if (bucket.tokens >= 1) {
        bucket.tokens--;
        return new RateLimitResult(true, (int)bucket.tokens, 0);
      }
      long retryAfter = (long)((1 - bucket.tokens) / refillRate * 1000);
      return new RateLimitResult(false, 0, retryAfter);
    }
  }
}`,
      tip:"Synchronized on the bucket object (not the method) = fine-grained locks. One user's request doesn't block another's."

      num:"06",label:"Code",title:"Code & concurrency",cls:"s6",
      concurrency:["ReentrantLock per room (not global lock)","Double-check after acquiring lock","Use database transactions in prod (SELECT FOR UPDATE)"],
      code:`class MeetingRoom {
  private final int id;
  private final List<Booking> bookings = new ArrayList<>();
  private final ReentrantLock lock = new ReentrantLock();

  public Booking book(TimeSlot slot, Employee e) {
    lock.lock();
    try {
      if (hasConflict(slot))
        throw new RoomUnavailableException(id, slot);
      Booking b = new Booking(UUID.randomUUID().toString(),
                              this, slot, e);
      bookings.add(b);
      return b;
    } finally { lock.lock(); }  // always release
  }

  private boolean hasConflict(TimeSlot newSlot) {
    return bookings.stream()
      .filter(b -> b.getStatus() == CONFIRMED)
      .anyMatch(b -> b.getSlot().overlaps(newSlot));
  }
}

// TimeSlot value object
record TimeSlot(LocalDateTime start, LocalDateTime end) {
  public boolean overlaps(TimeSlot other) {
    return start.isBefore(other.end) && end.isAfter(other.start);
  }
}`,

      code:`// State pattern for Elevator
interface ElevatorState {
  void handleRequest(Elevator e, int targetFloor);
  void openDoor(Elevator e);
}

class IdleState implements ElevatorState {
  public void handleRequest(Elevator e, int floor) {
    e.setDirection(floor > e.getCurrentFloor() ? UP : DOWN);
    e.setState(new MovingState());
    e.addDestination(floor);
  }
}

// SCAN scheduling in controller
class ScanScheduler implements SchedulingStrategy {
  public Elevator dispatch(List<Elevator> elevators, Request r) {
    return elevators.stream()
      .filter(e -> e.isMovingToward(r.getFloor()))
      .min(Comparator.comparingInt(
        e -> Math.abs(e.getCurrentFloor() - r.getFloor())))
      .orElse(findIdleOrLeastLoaded(elevators));
  }
}`,

      cardinality:"Scheduler 1→N ScheduledTasks; ThreadPool 1→N WorkerThreads",
      tip:"The dispatcher thread polls the queue for tasks whose time ≤ now, then submits to pool."
    },
    {
      num:"05",label:"Patterns",title:"Apply design patterns",cls:"s5",
      patterns:[
        {name:"Strategy",use:"RetryPolicy: NoRetry, FixedRetry, ExponentialBackoff"},
        {name:"Template Method",use:"AbstractTask with execute() + onSuccess() + onFailure()"},
        {name:"Observer",use:"TaskEventListener notified on COMPLETED / FAILED"},
        {name:"Builder",use:"TaskBuilder for optional fields (delay, priority, retryPolicy)"}
      ],
      tip:"ExponentialBackoff via Strategy is a real-world pattern — mention 'base * 2^attempt' formula."
    },
    {
      num:"06",label:"Code",title:"Code & concurrency",cls:"s6",
      concurrency:["PriorityBlockingQueue — thread-safe, blocks when empty","ThreadPoolExecutor with bounded queue + rejection policy","ReentrantLock for task cancellation (ConcurrentHashMap<id, Future>)"],
      code:`class TaskScheduler {
  private final PriorityBlockingQueue<ScheduledTask> queue
    = new PriorityBlockingQueue<>(16, Comparator
        .comparingLong(ScheduledTask::getScheduledTime)
        .thenComparing(ScheduledTask::getPriority));
  private final ExecutorService pool;
  private final Map<String, Future<?>> futures = new ConcurrentHashMap<>();
  private final ScheduledExecutorService dispatcher
    = Executors.newSingleThreadScheduledExecutor();

  public String schedule(Task task, long delayMs) {
    ScheduledTask st = new ScheduledTask(task,
        System.currentTimeMillis() + delayMs);
    queue.offer(st);
    return st.getId();
  }

  private void dispatchLoop() {
    while (!Thread.currentThread().isInterrupted()) {
      ScheduledTask st = queue.peek();
      if (st != null && st.getScheduledTime() <= System.currentTimeMillis()) {
        queue.poll();
        Future<?> f = pool.submit(st.getTask());
        futures.put(st.getId(), f);
      } else {
        LockSupport.parkNanos(1_000_000); // 1ms sleep
      }
    }
  }
}`,
      tip:"PriorityBlockingQueue sorted by (scheduledTime, priority). Dispatcher thread parks 1ms when nothing is due."
    }
  ]
}
};

function buildStep(s, idx){
  const open = idx===0;
  let html=`<div class="step ${s.cls}${open?' open':''}">
  <div class="step-header" onclick="toggleStep(this)">
    <div class="step-num">${s.num}</div>
    <div>
      <div class="step-title">${s.title}</div>
    </div>
    <span class="step-label">${s.label}</span>
    <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
  </div>
  <div class="step-body">`;

  if(s.actors){
    html+=`<div class="section"><div class="sec-title">Actors</div><div class="tags">`;
    s.actors.forEach(a=>html+=`<span class="tag purple">${a}</span>`);
    html+=`</div>`;
    html+=`<div class="sec-title" style="margin-top:8px">Functional requirements</div><div class="tags">`;
    s.functional.forEach(f=>html+=`<span class="tag teal">${f}</span>`);
    html+=`</div>`;
    html+=`<div class="sec-title" style="margin-top:8px">Non-functional</div><div class="tags">`;
    s.nonfunctional.forEach(f=>html+=`<span class="tag gray">${f}</span>`);
    html+=`</div>`;
    html+=`<div class="sec-title" style="margin-top:8px">Scale</div><span style="font-size:13px;color:var(--color-text-primary)">${s.scale}</span></div>`;
  }
  if(s.nouns){
    html+=`<div class="section"><div class="sec-title">Core nouns (entities)</div><div class="tags">`;
    s.nouns.forEach(n=>html+=`<span class="tag blue">${n}</span>`);
    html+=`</div>`;
    html+=`<div class="sec-title" style="margin-top:8px">Enums</div><div class="tags">`;
    s.enums.forEach(e=>html+=`<span class="tag amber">${e}</span>`);
    html+=`</div></div>`;
  }
  if(s.apis){
    html+=`<div class="section"><div class="sec-title">Entry points</div>`;
    html+=`<div class="code">${s.apis.join('\n')}</div></div>`;
  }
  if(s.relations){
    html+=`<div class="section"><div class="sec-title">Relationships</div><div class="tags" style="flex-direction:column;gap:4px">`;
    s.relations.forEach(r=>{
      const parts=r.split(' → ');
      const tag=parts[1]||'';
      const color=tag==='Composition'?'coral':tag==='Inheritance'?'purple':tag==='Association'?'teal':'gray';
      html+=`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="flex:1;color:var(--color-text-primary)">${parts[0]}</span><span class="tag ${color}" style="flex-shrink:0">${tag}</span></div>`;
    });
    html+=`</div>`;
    if(s.cardinality) html+=`<div style="font-size:12px;color:var(--color-text-secondary);margin-top:8px">${s.cardinality}</div>`;
    html+=`</div>`;
  }
  if(s.patterns){
    html+=`<div class="section"><div class="sec-title">Design patterns</div>`;
    s.patterns.forEach(p=>{
      html+=`<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:12px;border-bottom:0.5px solid var(--color-border-tertiary)"><span style="font-weight:500;color:var(--color-text-primary);min-width:110px">${p.name}</span><span style="color:var(--color-text-secondary)">${p.use}</span></div>`;
    });
    html+=`</div>`;
  }
  if(s.concurrency){
    html+=`<div class="section"><div class="sec-title">Thread safety</div><div class="tags">`;
    s.concurrency.forEach(c=>html+=`<span class="tag pink">${c}</span>`);
    html+=`</div></div>`;
  }
  if(s.code){
    html+=`<div class="section"><div class="sec-title">Sample implementation</div><div class="code">${escHtml(s.code)}</div></div>`;
  }
  html+=`<div class="tip">💡 ${s.tip}</div>`;
  html+=`</div></div>`;
  return html;
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildPanel(key){
  const d=DATA[key];
  let html=`<div class="steps">`;
  d.steps.forEach((s,i)=>html+=buildStep(s,i));
  html+=`</div>`;
  return html;
}

function toggleStep(header){
  const step=header.parentElement;
  step.classList.toggle('open');
}

function showPanel(key){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const panel=document.getElementById(key);
  if(!panel.innerHTML) panel.innerHTML=buildPanel(key);
  panel.classList.add('active');
  event.target.classList.add('active');
}

// Init first panel
document.getElementById('parking').innerHTML=buildPanel('parking');
</script>
