// Observer pattern: Kitchen listens
class Kitchen implements OrderObserver {
  private final BlockingQueue<Order> queue
    = new LinkedBlockingQueue<>();

  public void onOrderPlaced(Order order) {
    queue.offer(order);  // non-blocking enqueue

  public void processOrders() {  // chef thread
    while (true) {
      Order o = queue.take();      // blocks until order arrives
      o.updateStatus(PREPARING);
      cookOrder(o);
      o.updateStatus(READY);

class Order {
  private final List<OrderItem> items = new ArrayList<>();
  private volatile OrderStatus status = PLACED;
  private final List<OrderObserver> observers = new CopyOnWriteArrayList<>();

  public synchronized void addItem(OrderItem item) {
    if (status != PLACED && status != CONFIRMED)
      throw new IllegalStateException("Cannot modify order in " + status);
    items.add(item);
  }
  public void updateStatus(OrderStatus s) {
    this.status = s;
    observers.forEach(obs -> obs.onStatusChanged(this, s));
  }

interface NotificationChannel {
  void send(Notification n) throws DeliveryException;
  ChannelType getType();
}

class NotificationService {
  private final Map<ChannelType, NotificationChannel> channels;
  private final UserPreferenceStore prefs;
  private final BlockingQueue<Notification> queue
    = new LinkedBlockingQueue<>(10_000);
  private final ExecutorService workers
    = Executors.newFixedThreadPool(10);

  public void send(Notification n) {
    queue.offer(n);  // non-blocking; caller returns immediately
  }

  private void dispatchLoop() {  // runs in background thread
    while (true) {
      Notification n = queue.take();
      UserPreference p = prefs.get(n.getUserId());
      p.getChannels(n.getType()).forEach(ch ->
        workers.submit(() -> sendWithRetry(n, channels.get(ch))));
    }
  }

  private void sendWithRetry(Notification n, NotificationChannel ch) {
    int attempt = 0;
    while (attempt < 3) {
      try { ch.send(n); return; }
      catch (DeliveryException e) {
        long delay = (long)(Math.pow(2, attempt++) * 1000);
        Thread.sleep(delay);  // exponential backoff
      }
    }
    log.error("Delivery failed after retries: {}", n.getId());
  }
}`,

interface SchedulingStrategy {
  Elevator dispatch(List<Elevator> elevators, ExternalRequest req);
}

class ScanScheduler implements SchedulingStrategy {
  public Elevator dispatch(List<Elevator> cars, ExternalRequest req) {
    return cars.stream()
      .filter(e -> e.isMovingToward(req.getFloor(), req.getDir()))
      .min(Comparator.comparingInt(
        e -> Math.abs(e.getCurrentFloor() - req.getFloor())))
      .orElseGet(() -> cars.stream()
        .filter(e -> e.getState() == IDLE)
        .min(Comparator.comparingInt(
          e -> Math.abs(e.getCurrentFloor() - req.getFloor())))
        .orElse(leastLoadedCar(cars)));
  }
}

// State pattern for Elevator
class Elevator {
  private int currentFloor = 0;
  private Direction direction = IDLE;
  private final TreeSet<Integer> destinations = new TreeSet<>();
  private final ReentrantLock lock = new ReentrantLock();

  public synchronized void addDestination(int floor) {
    destinations.add(floor);
    if (direction == IDLE) direction =
      floor > currentFloor ? UP : DOWN;
  }
  public boolean isMovingToward(int floor, Direction d) {
    return direction == d &&
      ((d == UP && floor > currentFloor) ||
       (d == DOWN && floor < currentFloor));
  }
}`,

    try {
      if (hasOverlap(range))
        throw new VehicleUnavailableException(id, range);
      Reservation r = new Reservation(UUID.randomUUID().toString(),

      reservations.add(r);

  private boolean hasOverlap(DateRange newRange) {

// DateRange value object
record DateRange(LocalDate start, LocalDate end) {
  public boolean overlaps(DateRange other) {
    return start.isBefore(other.end) && end.isAfter(other.start);
  }
  public long days() {
    return ChronoUnit.DAYS.between(start, end);
  }
}

// Strategy for pricing
class LongTermDiscount implements PricingStrategy {
  public double calculate(Vehicle v, DateRange range) {
    long days = range.days();
    double base = v.getDailyRate() * days;
    return days >= 7 ? base * 0.85 : base;  // 15% off weekly
  }
